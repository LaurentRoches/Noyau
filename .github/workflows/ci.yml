name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  validate-game-data:
    name: Valider les fichiers JSON de données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Vérifier que les JSON sont valides
        run: |
          for f in backend/config/game/*.json; do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

  php-tests:
    name: Lint + tests PHP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Installer les dépendances
        run: composer install --prefer-dist --no-progress

      - name: Vérifier le style (PHP CS Fixer)
        run: composer run cs-check

      - name: Analyse statique (PHPStan)
        run: composer run stan

      - name: Tests unitaires (PHPUnit)
        run: composer run test

  frontend-tests:
    name: Lint + tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le style (ESLint + Prettier)
        run: npm run lint

      - name: Vérifier les types (vue-tsc)
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test